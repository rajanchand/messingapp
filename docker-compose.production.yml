# ============================================================
# Production deployment (Phase 6 / Wave 1).
#
# SAFETY:
# - Never exposes PostgreSQL or Redis publicly.
# - Never touches the existing matrix-synapse / matrix-postgres
#   containers or their volumes.
# - The admin panel reaches Synapse over its public HTTPS URL by
#   default; to use the internal Docker network instead, attach
#   the existing Matrix network below and set
#   MATRIX_HOMESERVER=http://matrix-synapse:8008
#
# Usage:
#   docker compose -f docker-compose.production.yml pull
#   docker compose -f docker-compose.production.yml run --rm zts-migrate
#   docker compose -f docker-compose.production.yml up -d
# ============================================================
services:
  zts-admin:
    image: ghcr.io/${GHCR_OWNER:-YOUR_GITHUB_USERNAME}/zts-admin:${IMAGE_TAG:-latest}
    container_name: zts-admin
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      zts-postgres:
        condition: service_healthy
      zts-redis:
        condition: service_healthy
    networks:
      - zts-internal
      # - matrix   # uncomment to reach Synapse over the internal network
    ports:
      # Bind to localhost only; the reverse proxy terminates TLS on 443.
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  zts-automation-worker:
    image: ghcr.io/${GHCR_OWNER:-YOUR_GITHUB_USERNAME}/zts-automation-worker:${IMAGE_TAG:-latest}
    container_name: zts-automation-worker
    restart: unless-stopped
    env_file: .env.production
    environment:
      AUTOMATION_CONCURRENCY: ${AUTOMATION_CONCURRENCY:-5}
    depends_on:
      zts-postgres:
        condition: service_healthy
      zts-redis:
        condition: service_healthy
    networks:
      - zts-internal
      # - matrix

  zts-migrate:
    image: ghcr.io/${GHCR_OWNER:-YOUR_GITHUB_USERNAME}/zts-admin-migrator:${IMAGE_TAG:-latest}
    profiles: ["tools"]
    env_file: .env.production
    depends_on:
      zts-postgres:
        condition: service_healthy
    networks:
      - zts-internal

  zts-postgres:
    image: postgres:16-alpine
    container_name: zts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ZTS_DB_USER:-zts}
      POSTGRES_PASSWORD: ${ZTS_DB_PASSWORD:?set ZTS_DB_PASSWORD}
      POSTGRES_DB: ${ZTS_DB_NAME:-zts}
    volumes:
      - zts_postgres_data:/var/lib/postgresql/data
    networks:
      - zts-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ZTS_DB_USER:-zts} -d ${ZTS_DB_NAME:-zts}"]
      interval: 10s
      timeout: 5s
      retries: 5

  zts-redis:
    image: redis:7-alpine
    container_name: zts-redis
    restart: unless-stopped
    # Prefer REDIS_PASSWORD from the host env. Without it Redis still starts
    # (useful for first bring-up); production MUST set a password and point
    # REDIS_URL at redis://:password@zts-redis:6379 — see DEPLOYMENT.md.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-changeme-set-REDIS_PASSWORD}
    volumes:
      - zts_redis_data:/data
    networks:
      - zts-internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${REDIS_PASSWORD:-changeme-set-REDIS_PASSWORD}\" ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  zts-internal:
    driver: bridge
  # matrix:
  #   external: true
  #   name: <existing-matrix-docker-network-name>

volumes:
  zts_postgres_data:
  zts_redis_data:
